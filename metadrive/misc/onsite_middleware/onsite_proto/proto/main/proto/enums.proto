//红绿灯颜色状态，ms8新增
enum TrafficLightColorStatus{
	TLCS_BLACK = 0;	//信号灯灭
	TLCS_RED = 1; //红灯
	TLCS_RED_FLASH = 2;	//红灯闪烁
	TLCS_GREEN = 4; //绿灯
	TLCS_GREEN_FLASH = 8; //绿灯闪烁
	TLCS_YELLOW = 16; //黄灯
	TLCS_YELLOW_FLASH = 32; //黄灯闪烁
	TLCS_BROKEN = 63; //所有灯都损坏
}

//红绿灯特性类型，ms8新增
enum TrafficLightDirectionType{
	TLDT_INVALID = 0;
	TLDT_MOTOR_VEHICLE_OMNI = 1;	//机动车信号灯,无方向
	TLDT_MOTOR_VEHICLE_STRAIGHT = 2; //机动车直行车灯
	TLDT_MOTOR_VEHICLE_LEFT = 3;	//机动车左转灯
	TLDT_MOTOR_VEHICLE_RIGHT = 4;	//机动车右转灯
	TLDT_MOTOR_VEHICLE_STRAIGHT_LEFT = 5;	//机动车直行-左转灯
	TLDT_MOTOR_VEHICLE_STRAIGHT_RIGHT = 6;	//机动车直行-右转灯
	TLDT_MOTOR_VEHICLE_LEFT_TURN_AROUND = 7;	//机动车左转-掉头灯
	TLDT_MOTOR_VEHICLE_TURN_AROUND = 8;	//机动车掉头灯
}

//交通信号灯分组类型
enum TrafficLightGroupType{
	TLGT_INVALID = 0;
	TLGT_MOTOR_VEHICLE = 1;	//机动车灯
	TLFT_NON_MOTOR_VEHICLE = 2;	//非机动车
	TLFT_PEDESTRIAN = 3;		//人行横道车灯
}

enum TrajectoryType {
	TT_INVALID = 0;
	TT_CANDIDATE = 1; //候选轨迹
	TT_EXECUTABLE = 2; //可执行轨迹
	TT_OPTIMAL = 3; //最优轨迹
}