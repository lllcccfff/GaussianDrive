syntax = "proto3";
package vts.protocol.main;

option java_multiple_files = true;
option java_package = "com.zhejianglab.vts.protocol.main";

// 消息类型,数据包中类型为uint16
enum MsgType {
	MT_INVALID = 0;
	MT_REGISTER = 1;
	MT_LOGIN = 2;
	MT_LOGOUT = 3;
	MT_ACCOUNT_RESULT = 4;
	MT_TRY_TEST = 5;
	MT_TRY_REPLAY = 6;
	MT_TRY_RESULT = 7;
	MT_SESSIONINFO = 8;
	MT_FETCH_SESSION_TEST_RESULT = 9;
	MT_SESSION_TEST_RESULT = 10;
	MT_DEBUG_SESSION = 11;
	MT_DEBUG_SESSION_RESULT = 12;
	MT_ACTOR_PREPARE = 13;
	MT_ACTOR_PREPARE_RESULT = 14;
	MT_QUERY_ARCHIVEINFO = 15;
	MT_ARCHIVEINFO_LIST = 16;
	MT_SUBROLE = 17;
	MT_SUBROLE_RESULT = 18;
	MT_PUBROLE = 19;
	MT_NOTIFY = 20;
	MT_TAKEOVERROLE = 21; //接管，ms6新增
	MT_TAKEOVERROLE_RESULT = 22; //接管结果，ms6新增
	MT_PUB_TRAFFICLIGHT = 23; //信号灯消息，ms8新增
	MT_PUB_PUBLOCALPLANTRAJECTORY = 24; //局部轨迹规划消息，ms9新增
	MT_PUB_PUBGLOBALPLANPATH = 25; //全局路径规划消息，ms9新增
	MT_SUBDATA = 26; //数据订阅消息，ms9新增
	MT_SUBDATA_RESULT = 27; //数据订阅结果消息，ms9新增
	MT_PUB_PERCEPTION_OBSTACLES = 28; //感知结果，ms10新增
}

// 角色容器类型
enum RoleContainerType {
	RCT_INVALID = 0;
	RCT_CONSOLE = 1; //前端控制器
	RCT_TESTEE = 2; //被测车
	RCT_OBSERVER = 3; //观察器
	RCT_DRIVE_SIMULATOR = 4; // 驾驶模拟器
	RCT_PARTICIPANT_VEHICLE = 5; //机动车陪练端
	RCT_PARTICIPANT_UNMOTORIZED_VEHICLE = 6; //非机动车陪练端
	RCT_PARTICIPANT_HUMAN = 7; //行人陪练端
	RCT_PARTICIPANT_ANIMAL = 8; //动物陪练端
	RCT_PARTICIPANT_ENV = 9; //环境控制器
	//ADD 2020-07-10
	RCT_EVALUATION = 10; //测试评价端
	RCT_PARTICIPANT_OBSTACLE = 11;//障碍物陪练端
	RCT_PARTICIPANT_TRAFFIC_LIGHT = 12;//信号灯陪练端
}

// Account操作类型
enum AccountOPType {
	AOT_INVALID = 0;
	AOT_REGISTER = 1;
	AOT_LOGIN = 2;
	AOT_LOGOUT = 3;
}

// Notify类型
enum NotifyType {
	NT_INVALID = 0;
	NT_START_TEST = 1;
	NT_ABORT_TEST = 2;
	NT_PAUSE_TEST = 3;
	NT_RESUME_TEST = 4;
	NT_STEP_TEST = 5;
	NT_FINISH_TEST = 6;
	NT_COLLIDE_ROLE = 7;
	NT_DESTROY_ROLE = 8;
	//ADD 2020-07-10
	NT_CROSS_SOLID_LINE = 9; //跨（压）实线
	NT_CROSS_DOTTED_LINE = 10; //跨（压）虚线
	NT_EXCEED_SPEED = 11; //超速
	NT_DRIVE_REVERSED = 12; //逆行
	NT_DEVIATE_DRIVING_AREA = 13; //偏离可行区域
	NT_DRIVE_RED_LIGHT = 14; //闯红灯
	NT_DRIVE_LOW_SPEED = 15; //低速行驶
	NT_WRONG_TURN_SIGNAL = 16; //未正确开启转向灯
	NT_SCORE_CHANGE = 17;//主控车分数变化
	NT_ARRIVED_ROLE = 18;//主控车到达终点
	NT_ROLLED = 19;//车辆翻滚
	NT_RISK_COLLIDE = 20;//存在碰撞风险
	//ADD 2021-01-27，ms7新增
	NT_RESET_ROLE = 21;//重设role状态
	//未按道路标线行驶，ms8新增
	NT_NOT_FOLLOWING_ROAD_MARKS = 22;
	//越线停车，ms8新增
	NT_PARKING_CROSSING_LINE = 23;
}

